name: Windows fixtures

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  regressions:
    name: Portable regressions (${{ matrix.shell }})
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Run portable regressions in PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion), commit $env:GITHUB_SHA"
          .\tests\run-script-regressions.ps1 -PortableOnly
      - name: Run portable regressions in Windows PowerShell
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion), commit $env:GITHUB_SHA"
          .\tests\run-script-regressions.ps1 -PortableOnly
